name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my-app-linux
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact_name: my-app-windows.exe
            use_cross: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Linkers
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Run Cargo Build (Release)
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages.targets[] | select(.kind[] == "bin") .name')
          
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            mv "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "./${{ matrix.artifact_name }}"
          else
            mv "target/${{ matrix.target }}/release/${BIN_NAME}" "./${{ matrix.artifact_name }}"
          fi

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Rolling Release
          body: |
            Šis leidimas yra automatiškai atnaujinamas po kiekvieno kodo pakeitimo.
            
            Paskutinis atnaujinimas (Commit): ${{ github.sha }}
            Paleidimo būdas: ${{ github.event_name == 'workflow_dispatch' && 'Rankinis' || 'Automatinis (Push)' }}
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            artifacts/my-app-linux
            artifacts/my-app-windows.exe
